<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kitty Pomodoro</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body data-mode="focus" data-status="idle" data-face="idle">
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-heart" viewBox="0 0 24 24">
        <path transform="translate(12 12)" d="M0 9 C-14 -1 -9 -11 -3.5 -11 C-1.5 -11 0 -9.5 0 -8 C0 -9.5 1.5 -11 3.5 -11 C9 -11 14 -1 0 9 Z"/>
      </symbol>
    </defs>
  </svg>

  <div class="app" id="app">
    <header class="top">
      <div class="brand">
        <svg class="brand-bow" viewBox="-24 -16 48 32" aria-hidden="true">
          <g stroke="#4a2c3a" stroke-width="2.6" stroke-linejoin="round" fill="#ec2c55">
            <path d="M0 0 C-7 -13 -22 -14 -23 -5 C-24 4 -10 9 0 0 Z"/>
            <path d="M0 0 C7 -13 22 -14 23 -5 C24 4 10 9 0 0 Z"/>
            <ellipse cx="0" cy="-1" rx="5" ry="6" fill="#ff4a6e"/>
          </g>
        </svg>
        <h1>Kitty Pomodoro</h1>
      </div>
      <button class="icon-btn" id="btn-settings" type="button" aria-label="Open settings" title="Settings">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="3.2"/>
          <path d="M12 2.8v2.4M12 18.8v2.4M2.8 12h2.4M18.8 12h2.4M5.5 5.5l1.7 1.7M16.8 16.8l1.7 1.7M5.5 18.5l1.7-1.7M16.8 7.2l1.7-1.7"/>
        </svg>
      </button>
    </header>

    <nav class="tabs" id="tabs" role="tablist" aria-label="Timer mode">
      <span class="tab-pill" aria-hidden="true"></span>
      <button class="tab" role="tab" type="button" data-mode="focus">Focus</button>
      <button class="tab" role="tab" type="button" data-mode="short">Short break</button>
      <button class="tab" role="tab" type="button" data-mode="long">Long break</button>
    </nav>

    <main class="stage">
      <div class="kitty-wrap" id="kitty-wrap">
        <svg class="kitty" viewBox="-6 0 232 170" fill="none" role="img" aria-label="Kitty mascot">
          <g stroke="#4a2c3a" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
            <path class="ear ear-l" d="M34 80 C22 56 22 30 33 17 Q40 9 54 16 C72 24 86 38 94 52 Z" fill="#fff"/>
            <path class="ear ear-r" d="M186 80 C198 56 198 30 187 17 Q180 9 166 16 C148 24 134 38 126 52 Z" fill="#fff"/>
            <path class="ear ear-l" d="M38 64 C34 50 34 38 39 29 Q43 25 52 30 C62 36 70 44 76 52 Z" fill="#ffc9d8" stroke="none"/>
            <path class="ear ear-r" d="M182 64 C186 50 186 38 181 29 Q177 25 168 30 C158 36 150 44 144 52 Z" fill="#ffc9d8" stroke="none"/>
            <ellipse cx="110" cy="100" rx="88" ry="60" fill="#fff"/>
            <path d="M24 88 L4 82 M22 100 L2 100 M24 112 L4 118"/>
            <path d="M196 88 L216 82 M198 100 L218 100 M196 112 L216 118"/>
            <ellipse cx="110" cy="112" rx="9" ry="6" fill="#ffd23f"/>
          </g>
          <ellipse cx="52" cy="118" rx="13" ry="8" fill="#ff8fb0" opacity=".45"/>
          <ellipse cx="168" cy="118" rx="13" ry="8" fill="#ff8fb0" opacity=".45"/>

          <!-- expressions, switched by body[data-face] -->
          <g class="eyes eyes-open">
            <g class="eye"><ellipse cx="72" cy="102" rx="7" ry="8.5" fill="#4a2c3a"/><circle cx="74.5" cy="98.5" r="2.4" fill="#fff"/></g>
            <g class="eye"><ellipse cx="148" cy="102" rx="7" ry="8.5" fill="#4a2c3a"/><circle cx="150.5" cy="98.5" r="2.4" fill="#fff"/></g>
          </g>
          <g class="eyes eyes-happy" stroke="#4a2c3a" stroke-width="5" stroke-linecap="round">
            <path d="M62 107 Q72 91 82 107"/>
            <path d="M138 107 Q148 91 158 107"/>
          </g>
          <g class="eyes eyes-sleepy" stroke="#4a2c3a" stroke-width="5" stroke-linecap="round">
            <path d="M62 98 Q72 110 82 98"/>
            <path d="M138 98 Q148 110 158 98"/>
          </g>

          <g transform="translate(168 50) rotate(-12) scale(.96)" stroke="#4a2c3a" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
            <path d="M0 0 C-14 -26 -44 -28 -46 -10 C-47 8 -20 18 0 0 Z" fill="#ec2c55"/>
            <path d="M0 0 C14 -26 44 -28 46 -10 C47 8 20 18 0 0 Z" fill="#ec2c55"/>
            <ellipse cx="0" cy="-2" rx="10" ry="12" fill="#ff4a6e"/>
            <g fill="#fff" stroke="none">
              <circle cx="-30" cy="-10" r="3"/><circle cx="-22" cy="2" r="2.4"/><circle cx="-36" cy="0" r="2"/>
              <circle cx="30" cy="-10" r="3"/><circle cx="22" cy="2" r="2.4"/><circle cx="36" cy="0" r="2"/>
            </g>
          </g>
        </svg>
      </div>

      <section class="card" aria-label="Timer">
        <i class="tape tape-l" aria-hidden="true"></i>
        <i class="tape tape-r" aria-hidden="true"></i>
        <svg class="paws" viewBox="0 0 220 34" aria-hidden="true">
          <g fill="#fff" stroke="#4a2c3a" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M52 30 C40 30 36 14 46 8 C56 2 76 6 80 18 C82 26 72 30 62 30 Z"/>
            <path d="M168 30 C180 30 184 14 174 8 C164 2 144 6 140 18 C138 26 148 30 158 30 Z"/>
            <path d="M58 14 L58 21 M66 13 L66 21" fill="none" stroke-width="2.6"/>
            <path d="M162 14 L162 21 M154 13 L154 21" fill="none" stroke-width="2.6"/>
          </g>
        </svg>

        <div class="ring">
          <svg viewBox="0 0 240 240" aria-hidden="true">
            <circle class="ring-track" cx="120" cy="120" r="106"/>
            <circle class="ring-bar" id="ring-bar" cx="120" cy="120" r="106" transform="rotate(-90 120 120)"/>
            <g id="ring-knob" class="ring-knob">
              <circle class="knob" cx="120" cy="14" r="9"/>
            </g>
          </svg>
          <div class="clock">
            <div class="time" id="time">25:00</div>
            <div class="caption" id="caption">ready to focus</div>
            <div class="dots" id="dots" aria-label="Focus sessions until the long break"></div>
          </div>
        </div>

        <div class="controls">
          <button class="btn-main" id="btn-main" type="button">
            <svg class="ic-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13a1 1 0 0 0 1.5.9l10.5-6.5a1 1 0 0 0 0-1.8L9.5 4.6A1 1 0 0 0 8 5.5Z"/></svg>
            <svg class="ic-pause" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4.2" height="14" rx="1.6"/><rect x="13.8" y="5" width="4.2" height="14" rx="1.6"/></svg>
            <span id="main-label">Start</span>
          </button>
          <button class="round-btn" id="btn-reset" type="button" aria-label="Reset timer" title="Reset">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.6-5.9"/><path d="M4 4.5v4.6h4.6"/></svg>
          </button>
        </div>
      </section>

      <label class="task">
        <i class="tape tape-note" aria-hidden="true"></i>
        <input id="task" type="text" maxlength="80" autocomplete="off" spellcheck="false" placeholder="what are you working on?" aria-label="What are you working on?" />
      </label>

      <p class="today" id="today"></p>
    </main>

    <section class="panel" id="panel-settings" aria-label="Settings" inert>
      <header class="panel-head">
        <button class="icon-btn" type="button" id="btn-back" aria-label="Back">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
        </button>
        <h2>Settings</h2>
      </header>
      <div class="panel-body">
        <div class="group">
          <div class="row"><span>Focus</span><div class="stepper" data-key="focus"></div></div>
          <div class="row"><span>Short break</span><div class="stepper" data-key="short"></div></div>
          <div class="row"><span>Long break</span><div class="stepper" data-key="long"></div></div>
          <label class="row"><span>Sound</span><span class="switch"><input type="checkbox" id="sound" /><i></i></span></label>
        </div>
        <p class="fine">Durations apply to the next session you start.</p>
      </div>
    </section>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
