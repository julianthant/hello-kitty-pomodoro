<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kitty Pomodoro</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body data-mode="focus" data-status="idle" data-face="idle">
  <div class="app" id="app">
    <header class="top">
      <div class="brand">
        <span id="brand-bow"></span>
        <h1>kitty pomodoro</h1>
      </div>
      <button class="icon-btn" id="btn-settings" type="button" aria-label="Open settings" title="Settings" data-icon="gear"></button>
    </header>

    <nav class="tabs" id="tabs" role="tablist" aria-label="Timer mode">
      <span class="tab-pill" aria-hidden="true"></span>
      <button class="tab" role="tab" type="button" data-mode="focus">Focus</button>
      <button class="tab" role="tab" type="button" data-mode="short">Short break</button>
      <button class="tab" role="tab" type="button" data-mode="long">Long break</button>
    </nav>

    <main class="stage">
      <div class="kitty-wrap" id="kitty-wrap">
        <svg class="kitty" id="kitty" role="img" aria-label="Kitty mascot"></svg>
      </div>

      <section class="card" aria-label="Timer">
        <svg class="paws" id="paws" aria-hidden="true"></svg>

        <div class="time" id="time" role="timer" aria-label="25:00"></div>
        <div class="caption" id="caption">ready to focus</div>
        <div class="bar" id="bar" aria-hidden="true"></div>
        <div class="dots" id="dots" aria-label="Focus sessions until the long break"></div>

        <div class="controls">
          <button class="btn-main" id="btn-main" type="button">
            <span class="ic-play" data-icon="play"></span>
            <span class="ic-pause" data-icon="pause"></span>
            <span id="main-label">Start</span>
          </button>
          <button class="round-btn" id="btn-reset" type="button" aria-label="Reset timer" title="Reset" data-icon="reset"></button>
        </div>
      </section>

      <label class="task">
        <input id="task" type="text" maxlength="80" autocomplete="off" spellcheck="false" placeholder="what are you working on?" aria-label="What are you working on?" />
      </label>

      <p class="today" id="today"></p>
    </main>

    <section class="panel" id="panel-settings" aria-label="Settings" inert>
      <header class="panel-head">
        <button class="icon-btn" type="button" id="btn-back" aria-label="Back" data-icon="back"></button>
        <h2>settings</h2>
      </header>
      <div class="panel-body">
        <div class="group">
          <div class="row"><span>Focus</span><div class="stepper" data-key="focus"></div></div>
          <div class="row"><span>Short break</span><div class="stepper" data-key="short"></div></div>
          <div class="row"><span>Long break</span><div class="stepper" data-key="long"></div></div>
          <label class="row"><span>Sound</span><span class="switch"><input type="checkbox" id="sound" /><i></i></span></label>
        </div>
        <p class="fine">Durations apply to the next session you start.</p>
      </div>
    </section>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
